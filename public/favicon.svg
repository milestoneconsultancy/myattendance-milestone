<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#brandGrad)"/>
  
  <!-- Outer Ring / Geofence Motif -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Milestone "M" Geometric Shape -->
  <path d="M140 350 V200 L256 295 L372 200 V350" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Location Pin & Check Accent -->
  <circle cx="256" cy="155" r="32" fill="url(#accentGrad)" />
  <circle cx="256" cy="155" r="14" fill="#ffffff" />
</svg>